[alembic]
# Path to the database
# sqlalchemy.url = postgresql://user:pass@localhost/dbname
sqlalchemy.url = postgresql+asyncpg://comment_checker:your_secure_db_password_here@db:5432/comment_checker

# Additional settings for async
# These are used by alembic when running migrations

# Path to migration scripts
script_location = src/migrations

# Version path separator
version_path_separator = os

# Output encoding
output_encoding = utf-8

# Logging
# logging_level = INFO
# logging_format = %(asctime)s %(levelname)s %(message)s

# Prefix for alembic tables
# user_module_prefix = sa.

# SQLAlchemy settings
# user_module = 

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic
